<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Calculador de Días de Vida 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Courier New', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            border: 5px solid #FFD700;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            text-align: center;
            color: #764ba2;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .emoji-title {
            text-align: center;
            font-size: 2em;
            margin-bottom: 20px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #667eea;
            font-weight: bold;
            font-size: 1.1em;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 3px dashed #764ba2;
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Comic Sans MS', cursive;
            transition: all 0.3s ease;
            background: rgba(240, 147, 251, 0.1);
        }

        input:focus {
            outline: none;
            border: 3px solid #764ba2;
            background: rgba(240, 147, 251, 0.3);
            box-shadow: 0 0 20px rgba(118, 75, 162, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(118, 75, 162, 0.5);
        }

        button:active {
            transform: scale(0.95);
        }

        .resultado {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #fff5e6 0%, #ffe6f0 100%);
            border-radius: 15px;
            border: 3px solid #FFD700;
            text-align: center;
        }

        .resultado.show {
            display: block;
            animation: popUp 0.6s ease-out;
        }

        @keyframes popUp {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .resultado h2 {
            color: #764ba2;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .dias {
            font-size: 2.5em;
            color: #667eea;
            font-weight: bold;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .mensaje-especial {
            font-size: 1.3em;
            color: #FF6B6B;
            font-weight: bold;
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 2px solid #FF6B6B;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
        }

        .info {
            color: #667eea;
            margin-top: 20px;
            font-size: 0.9em;
            text-align: center;
        }

        .decoracion {
            text-align: center;
            font-size: 2em;
            margin: 15px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji-title">🎂</div>
        <h1>Calculador de Días de Vida</h1>
        <p class="info">¡Descubre cuántos días has vivido! 🌟</p>
        
        <form id="formulario">
            <div class="form-group">
                <label for="nombre">👤 Tu nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan" required>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">📅 Fecha de nacimiento:</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <button type="submit">🚀 ¡Calcular mis días! 🚀</button>
        </form>

        <div class="resultado" id="resultado">
            <div class="decoracion">🎉 🎊 🎈</div>
            <h2>¡Hola, <span id="nombreResultado"></span>!</h2>
            <p>Has vivido:</p>
            <div class="dias" id="diasVividos"></div>
            <p>desde tu nacimiento</p>
            <div id="mensajeEspecial"></div>
        </div>
    </div>

    <script>
        const formulario = document.getElementById('formulario');
        const resultado = document.getElementById('resultado');
        const nombreResultado = document.getElementById('nombreResultado');
        const diasVividos = document.getElementById('diasVividos');
        const mensajeEspecial = document.getElementById('mensajeEspecial');

        formulario.addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const fechaNacimiento = new Date(document.getElementById('fechaNacimiento').value);
            const hoy = new Date();

            // Validar que la fecha no sea en el futuro
            if (fechaNacimiento > hoy) {
                alert('¡Oye! La fecha de nacimiento no puede ser en el futuro 😄');
                return;
            }

            // Calcular días transcurridos
            const diferencia = hoy - fechaNacimiento;
            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));

            // Calcular años
            let años = hoy.getFullYear() - fechaNacimiento.getFullYear();
            const mesActual = hoy.getMonth();
            const mesNacimiento = fechaNacimiento.getMonth();
            
            if (mesActual < mesNacimiento || (mesActual === mesNacimiento && hoy.getDate() < fechaNacimiento.getDate())) {
                años--;
            }

            // Mostrar resultados
            nombreResultado.textContent = nombre;
            diasVividos.textContent = dias.toLocaleString('es-ES') + ' días';

            // Limpiar mensaje especial
            mensajeEspecial.innerHTML = '';

            // Verificar si tiene más de 50 años
            if (años > 50) {
                mensajeEspecial.innerHTML = '<div class="mensaje-especial">🎸 ¡Estás hecho un chaval! 🎸</div>';
                crearConfeti();
            }

            // Mostrar resultado con animación
            resultado.classList.remove('show');
            setTimeout(() => {
                resultado.classList.add('show');
            }, 10);
        });

        // Función para crear confeti
        function crearConfeti() {
            const colores = ['🎉', '🎊', '⭐', '✨', '🌟', '💫', '🎈', '🎁'];
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.textContent = colores[Math.floor(Math.random() * colores.length)];
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-20px';
                    confetti.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    confetti.style.opacity = '1';
                    
                    document.body.appendChild(confetti);
                    
                    let top = -20;
                    let left = parseFloat(confetti.style.left);
                    let velocity = Math.random() * 3 + 2;
                    
                    const caer = setInterval(() => {
                        top += velocity;
                        left += (Math.random() - 0.5) * 2;
                        confetti.style.top = top + 'px';
                        confetti.style.left = left + 'px';
                        confetti.style.opacity = 1 - (top / window.innerHeight);
                        
                        if (top > window.innerHeight) {
                            clearInterval(caer);
                            confetti.remove();
                        }
                    }, 20);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
